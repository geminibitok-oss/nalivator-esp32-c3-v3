name: Build ESP32 Firmware

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install Libraries
        run: |
          mkdir -p ~/Arduino/libraries/
          cp -r libraries/* ~/Arduino/libraries/

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 NalivatorEsp/NalivatorEsp.ino --output-dir build_output

      - name: Generate Flash Scripts
        run: |
          # Создаем flash_windows.bat с правильными CRLF переносами строк
          printf "@echo off\r\n" > build_output/flash_windows.bat
          printf "title ESP32-C3 Firmware Flasher\r\n" >> build_output/flash_windows.bat
          printf "echo ======================================================\r\n" >> build_output/flash_windows.bat
          printf "echo            ESP32-C3 Firmware Flasher\r\n" >> build_output/flash_windows.bat
          printf "echo ======================================================\r\n" >> build_output/flash_windows.bat
          printf "echo.\r\n" >> build_output/flash_windows.bat
          printf "where python >nul 2>nul\r\n" >> build_output/flash_windows.bat
          printf "if %%errorlevel%% neq 0 (\r\n" >> build_output/flash_windows.bat
          printf "    echo [ERROR] Python is not installed or not in PATH!\r\n" >> build_output/flash_windows.bat
          printf "    echo Please install Python from https://www.python.org/ and check 'Add to PATH'\r\n" >> build_output/flash_windows.bat
          printf "    pause\r\n" >> build_output/flash_windows.bat
          printf "    exit /b 1\r\n" >> build_output/flash_windows.bat
          printf ")\r\n" >> build_output/flash_windows.bat
          printf "echo [*] Checking esptool...\r\n" >> build_output/flash_windows.bat
          printf "pip install --upgrade esptool\r\n" >> build_output/flash_windows.bat
          printf "echo.\r\n" >> build_output/flash_windows.bat
          printf "echo [*] Starting flashing ESP32-C3...\r\n" >> build_output/flash_windows.bat
          printf "python -m esptool --chip esp32c3 write_flash 0x0 NalivatorEsp.ino.bootloader.bin 0x8000 NalivatorEsp.ino.partitions.bin 0x10000 NalivatorEsp.ino.bin\r\n" >> build_output/flash_windows.bat
          printf "if %%errorlevel%% equ 0 (\r\n" >> build_output/flash_windows.bat
          printf "    echo.\r\n" >> build_output/flash_windows.bat
          printf "    echo [SUCCESS] ESP32-C3 flashed successfully!\r\n" >> build_output/flash_windows.bat
          printf ") else (\r\n" >> build_output/flash_windows.bat
          printf "    echo.\r\n" >> build_output/flash_windows.bat
          printf "    echo [ERROR] Flash failed.\r\n" >> build_output/flash_windows.bat
          printf "    echo Hint: Hold BOOT button on ESP32, press RESET, release BOOT and try again.\r\n" >> build_output/flash_windows.bat
          printf ")\r\n" >> build_output/flash_windows.bat
          printf "echo.\r\n" >> build_output/flash_windows.bat
          printf "pause\r\n" >> build_output/flash_windows.bat

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: build_output/
