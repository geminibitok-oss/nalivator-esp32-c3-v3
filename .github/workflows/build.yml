name: Build ESP32 Firmware

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install Libraries
        run: |
          mkdir -p ~/Arduino/libraries/
          cp -r libraries/* ~/Arduino/libraries/

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 NalivatorEsp/NalivatorEsp.ino --output-dir build_output

      - name: Create Auto-Flash Scripts
        run: |
          # Создаем flash_windows.bat для Windows
          cat << 'EOF' > build_output/flash_windows.bat
          @echo off
          chcp 65001 > nul
          echo ======================================================
          echo      Автоматическая прошивка ESP32-C3
          echo ======================================================
          echo.
          
          python --version >nul 2>&1
          if %errorlevel% neq 0 (
              echo [!] Ошибка: Python не установлен!
              echo Установите Python с сайта https://www.python.org/ (обязательно поставьте галочку "Add to PATH")
              pause
              exit /b 1
          )

          echo [*] Проверка и установка esptool...
          pip install --upgrade esptool >nul 2>&1

          echo [*] Прошивка ESP32-C3...
          python -m esptool --chip esp32c3 write_flash 0x0 NalivatorEsp.ino.bootloader.bin 0x8000 NalivatorEsp.ino.partitions.bin 0x10000 NalivatorEsp.ino.bin

          if %errorlevel% equ 0 (
              echo.
              echo [OK] УСПЕШНО! Прошивка успешно загружена на ESP32-C3.
          ) else (
              echo.
              echo [!] Ошибка прошивки.
              echo Подсказка: Зажмите кнопку BOOT на плате, нажмите RESET, отпустите BOOT и повторите запуск.
          )
          echo.
          pause
          EOF

          # Создаем flash_linux_mac.sh для Linux / macOS
          cat << 'EOF' > build_output/flash_linux_mac.sh
          #!/bin/bash
          echo "======================================================"
          echo "     Автоматическая прошивка ESP32-C3"
          echo "======================================================"
          
          if ! command -v python3 &> /dev/null; then
              echo "[!] Python3 не найден. Установите python3."
              exit 1
          fi

          pip3 install --upgrade esptool
          python3 -m esptool --chip esp32c3 write_flash 0x0 NalivatorEsp.ino.bootloader.bin 0x8000 NalivatorEsp.ino.partitions.bin 0x10000 NalivatorEsp.ino.bin
          EOF
          chmod +x build_output/flash_linux_mac.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: build_output/
