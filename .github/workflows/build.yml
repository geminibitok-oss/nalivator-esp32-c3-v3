name: Build and Release ESP32 Firmware

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install Libraries
        run: |
          mkdir -p ~/Arduino/libraries/
          cp -r libraries/* ~/Arduino/libraries/

      - name: Determine Next Version
        id: versioning
        run: |
          BUILD_NUM="${{ github.run_number }}"
          TAG_NAME="v1.0.${BUILD_NUM}"
          echo "CURRENT_TAG=${TAG_NAME}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_NUM}" >> $GITHUB_ENV

          # Записываем версию в код
          cat << EOF > NalivatorEsp/version.h
          #pragma once
          #define FIRMWARE_VERSION "1.0.${BUILD_NUM}"
          #define BUILD_TIMESTAMP __DATE__ " " __TIME__
          EOF
          sed -i 's/^[ \t]*//' NalivatorEsp/version.h

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 NalivatorEsp/NalivatorEsp.ino --output-dir build_output

      - name: Package Flasher and Rename Firmware
        run: |
          cp build_output/NalivatorEsp.ino.bin build_output/firmware.bin
          cp build_output/NalivatorEsp.ino.bin "build_output/nalivator_${CURRENT_TAG}.bin"

          mkdir -p temp_zip
          curl -L -o esptool_win.zip https://github.com/espressif/esptool/releases/download/v4.7.0/esptool-v4.7.0-win64.zip
          unzip -q esptool_win.zip -d temp_zip
          find temp_zip -name "esptool.exe" -exec cp {} build_output/esptool.exe \;
          rm -rf temp_zip esptool_win.zip

          cat << 'EOF' > build_output/flash_windows.bat
          @echo off
          chcp 65001 >nul
          cd /d "%~dp0"
          title ESP32-C3 Firmware Flasher

          echo ======================================================
          echo       ESP32-C3 Flasher - Nalivator Firmware
          echo ======================================================
          echo.

          if not exist "%~dp0esptool.exe" (
              echo [ERROR] esptool.exe not found!
              pause
              exit /b 1
          )

          echo [*] Flashing ESP32-C3...
          "%~dp0esptool.exe" --chip esp32c3 write_flash 0x0 "%~dp0NalivatorEsp.ino.bootloader.bin" 0x8000 "%~dp0NalivatorEsp.ino.partitions.bin" 0x10000 "%~dp0NalivatorEsp.ino.bin"

          if errorlevel 1 (
              echo.
              echo ======================================================
              echo  [ERROR] Flash failed!
              echo  Hint: Hold BOOT button on ESP32, press RESET,
              echo        release BOOT and try again.
              echo ======================================================
          ) else (
              echo.
              echo ======================================================
              echo  [SUCCESS] ESP32-C3 flashed successfully!
              echo ======================================================
          )

          echo.
          pause
          EOF

          sed -i 's/$/\r/' build_output/flash_windows.bat
          sed -i 's/^[ \t]*//' build_output/flash_windows.bat

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-${{ env.CURRENT_TAG }}
          path: build_output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ env.CURRENT_TAG }}
          name: "Наливатор Прошивка ${{ env.CURRENT_TAG }}"
          body: |
            Автоматическая сборка прошивки Наливатора ESP32-C3.
            
            - **Версия:** `${{ env.CURRENT_TAG }}`
            - **Сборка:** `#${{ env.BUILD_NUMBER }}`
            - **Коммит:** `${{ github.sha }}`
          files: |
            build_output/firmware.bin
            build_output/nalivator_${{ env.CURRENT_TAG }}.bin
            build_output/NalivatorEsp.ino.bin
            build_output/NalivatorEsp.ino.bootloader.bin
            build_output/NalivatorEsp.ino.partitions.bin
            build_output/esptool.exe
            build_output/flash_windows.bat
